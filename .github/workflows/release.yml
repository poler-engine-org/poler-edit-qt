name: Release Builds

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout poler-edit-qt
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build poler-edit-core (Rust backend)
        run: |
          cd core
          cargo build --release

      - name: Install Qt6 & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI
        run: cmake --build build

      - name: Package Linux Bundle
        run: |
          mkdir -p dist
          cp build/poler-edit dist/poler-edit
          cp core/target/release/poler-edit-core dist/poler-edit-core
          tar -czvf poler-edit-linux-x86_64.tar.gz -C dist poler-edit poler-edit-core

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poler-edit-linux-x86_64
          path: poler-edit-linux-x86_64.tar.gz

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout poler-edit-qt
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build poler-edit-core (Rust backend)
        run: |
          cd core
          cargo build --release

      - name: Install Qt6 via jurplel/install-qt-action
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'

      - name: Enable MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI
        run: cmake --build build --config Release

      - name: Package Windows Bundle
        shell: bash
        run: |
          mkdir -p dist
          cp build/Release/poler-edit.exe dist/ || cp build/poler-edit.exe dist/
          cp core/target/release/poler-edit-core.exe dist/
          windeployqt dist/poler-edit.exe --no-translations --compiler-runtime
          cd dist && 7z a ../poler-edit-windows-x86_64.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poler-edit-windows-x86_64
          path: poler-edit-windows-x86_64.zip

  build-macos:
    name: macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout poler-edit-qt
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build poler-edit-core (Rust backend)
        run: |
          cd core
          cargo build --release

      - name: Install Qt6
        run: brew install qt cmake ninja

      - name: Configure CMake
        run: cmake -B build -S . -G Ninja -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI
        run: cmake --build build

      - name: Package macOS Bundle
        run: |
          mkdir -p dist
          cp build/poler-edit dist/poler-edit
          cp core/target/release/poler-edit-core dist/poler-edit-core
          tar -czvf poler-edit-macos.tar.gz -C dist poler-edit poler-edit-core

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poler-edit-macos
          path: poler-edit-macos.tar.gz

  build-android:
    name: Android APK (ARM64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout poler-edit-qt
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build poler-edit-core for Android ARM64
        run: |
          cd core
          cargo ndk -t arm64-v8a build --release
          mkdir -p ../android/libs/arm64-v8a
          cp target/aarch64-linux-android/release/poler-edit-core ../android/libs/arm64-v8a/libpoler-edit-core.so

      - name: Install Qt6 for Android
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'android'
          arch: 'android_arm64_v8a'

      - name: Build Android APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cmake -B build-android -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$Qt6_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --target aab || cmake --build build-android --target apk || true
          find build-android -name "*.apk" -exec cp {} ./poler-edit.apk \; || true
          if [ ! -f poler-edit.apk ]; then
            tar -czvf poler-edit-android-core-arm64.tar.gz -C android/libs/arm64-v8a libpoler-edit-core.so
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poler-edit-android-arm64
          path: |
            poler-edit.apk
            poler-edit-android-core-arm64.tar.gz
          if-no-files-found: ignore

