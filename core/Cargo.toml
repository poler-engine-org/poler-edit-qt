[package]
name = "poler-edit-core"
version = "0.3.0"
edition = "2021"
description = "Pure Piece-Table buffer backend for poler-edit"
license = "MIT OR Apache-2.0"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2.7"
aho-corasick = "1.1"
libc = "0.2"
ed25519-dalek = "2"

[[bin]]
name = "poler-edit-core"
path = "src/main.rs"

# Инструмент издателя лицензий (бесполезен без секретного ключа, которого
# в репозитории нет). Подробности: src/license.rs.
[[bin]]
name = "poler-edit-keygen"
path = "src/bin/keygen.rs"

[dev-dependencies]
# ГРАБЛЯ №1: тесты buffer.rs всегда юзали tempfile::tempdir(), но зависимости
# не были объявлены — `cargo test` не компилировался вовсе (CI гнал только build).
tempfile = "3"
